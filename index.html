<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDx7tp4GyGn41rySerMYxRuRL1SbEYvFI",
  authDomain: "don-booking.firebaseapp.com",
  projectId: "don-booking",
  storageBucket: "don-booking.firebasestorage.app",
  messagingSenderId: "794739402330",
  appId: "1:794739402330:web:e55f8eff314a6bbd905a63",
  measurementId: "G-ZZLDFH0T1T"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.bookNow = async function(){

  const booking = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    barber: document.getElementById("barber").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    service: document.getElementById("service").value,
    createdAt: new Date()
  };

  try{

    await setDoc(doc(db,"bookings", booking.name), booking);

    alert("Booking Saved ✅");

  }

  catch(error){

    alert("Error saving booking");

    console.log(error);

  }

}

</script>
